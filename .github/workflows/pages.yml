name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - name: Link check (report only — gov.il may 403 from CI)
        run: node scripts/check-links.mjs || true

  # Kol Zchut and gov.il answer 403 to plain HTTP clients; this job loads every URL in a real
  # headless Chromium instead. Run it manually: Actions → this workflow → Run workflow.
  links-browser:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: NODE_PATH=$(npm root -g) node scripts/check-links.mjs --browser --timeout=30000 --concurrency=2

  # Deploys only when the repository variable DEPLOY_WITH_ACTIONS is "true"
  # (Settings → Secrets and variables → Actions → Variables) AND Settings → Pages → Source is
  # "GitHub Actions". Otherwise use the zero-config path: Settings → Pages → Deploy from a branch.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_WITH_ACTIONS == 'true'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
